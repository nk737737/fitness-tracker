<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>My Fitness Tracker</h1>
    <p>Track your workouts and progress</p>
</header>
    <main>
    <section>
        <h2>Dashboard</h2>
    <div class="stats-grid">
        <div>
            <h3>Total Workouts</h3>
            <p id="totalWorkouts">0</p>
        </div>

        <div>
            <h3>Running Time</h3>
            <p id="runningTime">0 min</p>
        </div>

        <div>
            <h3>Strength Workouts</h3>
            <p id="strengthWorkouts">0</p>
        </div>
     </div>
     </section>
     <section>
     <h2>Workout History</h2>
     <input type="text" id="searchWorkouts" placeholder="Search workouts...">
     <ul id="workoutList"></ul>
     <p id="emptyMessage"></p>
     <input id="searchWorkoutId" type="number" placeholder="Enter workout ID" min="1">
     <button id="searchWorkoutBtn">Search</button>
     <p id="searchResult"></p>

<div class="workout-controls">
    <div>
     <label for="sortWorkouts">Sort workouts</label>
<select id="sortWorkouts">
        <option value="default">Default</option>
        <option value="asc">Shortest first</option>
        <option value="desc">Longest first</option>
</select>
</div>
<div>
<label for="filterType">Filter by type</label>
<select id="filterType">
    <option value="all">All</option>
    <option value="running">Running</option>
    <option value="strength">Strength</option>
    <option value="yoga">Yoga</option>
    <option value="walking">Walking</option>
    </select>
    </div>
    </div>


    </section>
    <section>
        <h2>Workout Summary</h2>
        <label for="summaryType">Workout Type</label>
<select id="summaryType">
    <option value="all">All</option>
    <option value="running">Running</option>
    <option value="strength">Strength</option>
    <option value="yoga">Yoga</option>
    <option value="walking">Walking</option>
</select>
<div class="summary-grid">
        <div>
    <h3>Workouts</h3>
    <p id="summaryCount">0</p>
</div>
<div>
    <h3>Total Duration</h3>
    <p id="summaryDuration">0 min</p>
</div>

<div>
    <h3>Average Duration</h3>
    <p id="summaryAverage">0 min</p>
</div>
</div>
    </section>
    <section>
        <h2>Add Workout</h2>
<form class="workout-form">
    <div>
<label for="workoutType">Workout Type</label>
<select id="workoutType" required>
    <option value="">Select workout</option>
    <option value="running">Running</option>
    <option value="strength">Strength</option>
    <option value="yoga">Yoga</option>
    <option value="walking">Walking</option>
</select>
</div>
<div>
<label for="duration">Duration (minutes)</label>
<input type="number" id="duration" min="1" placeholder="e.g. 30" required>
</div>
<div>
<label for="workoutDate">Workout Date</label>
<input type="date" id="workoutDate" required>
</div>
<div>
<label for="workoutNotes">Notes(optional)</label>
<textarea id="workoutNotes" rows="3" placeholder="How did your workout go?"></textarea>
</div>
<button type="button" id="addWorkoutBtn">Add Workout</button>
</form>
    </section>
</main>
<script src="script.js"></script>
<script src="tests.js"></script>
</body>
</html>
